[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operator-testbed"
version = "0.1.0"
description = "Simulated unmanned gas compressor station for AI-operator safety evaluations (simulation only)."
requires-python = ">=3.13"
dependencies = ["anthropic>=2.6.0", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["testbed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
